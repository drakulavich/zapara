name: npm publish

# The only path to npm, same shape as oura-cli's release.yml: push a tag vX.Y.Z and
# this checks the commit again, publishes through OIDC trusted publishing (npmjs.com
# trusts this repository and this file name; no npm token exists anywhere) and creates
# the GitHub release with that version's CHANGELOG block as the notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The same gate as ci.yml: a tag on a broken commit must not publish.
      - run: bun run check
        env:
          ZAPARA_REQUIRE_WEBVIEW: "1"

      - name: The tag must be v<version from package.json>
        run: |
          version=$(jq -r .version package.json)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag is $GITHUB_REF_NAME but package.json says $version"; exit 1; }

      # Trusted Publishing needs Node 22.14+ and npm 11.5.1+.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: npm publish --provenance

      - name: Create the GitHub release from the CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (inblock) exit; if ($0 ~ "\\[" ver "\\]") { inblock = 1; next } }
            inblock { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
