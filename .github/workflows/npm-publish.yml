name: npm publish

# The only path to npm. Runs when a GitHub release is published (the manual gate) or by
# hand for an existing tag. Trusted Publishing: npm exchanges this job's GitHub OIDC token
# for a short-lived credential, so no npm token exists anywhere. The package must be
# configured as a Trusted Publisher on npmjs.com for this repository and this workflow
# file name. A SemVer prerelease (v0.2.0-beta.1) publishes under its identifier's
# dist-tag (`beta`) so `@latest` never gets an unstable build.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # The tag reaches the shell through env, never interpolation: a tag is user input.
      - name: Resolve tag and version
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; else tag="$RELEASE_TAG"; fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag '$tag' is not vX.Y.Z or vX.Y.Z-pre.N" >&2; exit 1
          fi
          version="${tag#v}"
          case "$version" in
            *-*) pre="${version#*-}"; dist_tag="${pre%%.*}" ;;
            *) dist_tag=latest ;;
          esac
          { echo "tag=$tag"; echo "version=$version"; echo "dist_tag=$dist_tag"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Check before the world sees it
        run: bun run check
        env:
          ZAPARA_REQUIRE_WEBVIEW: "1"

      - name: Verify package.json version matches the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          actual=$(jq -r .version package.json)
          if [ "$VERSION" != "$actual" ]; then
            echo "::error::tag says $VERSION but package.json says $actual" >&2
            exit 1
          fi

      # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1; registry-url sets the
      # target without any token.
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest && npm --version

      # A re-run after a successful publish must be a no-op, not a failure.
      - name: Skip if this version is already on npm
        id: registry
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.registry.outputs.published == 'false'
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
